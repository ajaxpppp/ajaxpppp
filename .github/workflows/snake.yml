# GitHub Action for generating a contribution graph with a snake eating your contributions.

name: Generate Snake

# Controls when the action will run. This action runs every 6 hours.
on:
  schedule:
    # every 6 hours
    - cron: "0 */6 * * *"

  # This command allows us to run the Action automatically from the Actions tab.
  workflow_dispatch:

  # Run on every push on the main branch
  push:
    branches:
      - main

# The sequence of runs in this workflow:
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks repo under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v3

      # Generates the snake
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          # GitHub user name to read the contribution graph from (**required**)
          # Replace with your GitHub username
          github_user_name: ajaxpppp
          
          # list of files to generate.
          # one file per line. Each output can be customized with options as query string.
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#2F81F7&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#2F81F7
            dist/github-contribution-grid-snake-dark.svg?color_snake=#2F81F7&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#2F81F7
            dist/ocean.gif?color_snake=#2F81F7&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#2F81F7

      # Push the changes
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
